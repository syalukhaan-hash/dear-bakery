<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Dear Bakery</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ecddc5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 100 100'><text y='90' font-size='90'>👨‍🍳</text></svg>") 15 15, auto;
            perspective: 1000px;
        }

        #emoji-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .forgot-container {
            background-color: #f8f0e5;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.199);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.1s ease-out;
            position: relative;
            z-index: 1;
        }

        h2 {
            margin-bottom: 20px;
            color: #6d5643;
            font-size: 1.8rem;
            transition: all 0.3s ease;
        }
        
        h2:hover {
            transform: scale(1.05);
            color: #c9a66b;
        }
        
        .subtitle {
            font-size: 0.95rem;
            color: #6d5643;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #6d5643;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        
        .form-group label:hover {
            color: #c9a66b;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d4c5b0;
            border-radius: 5px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c49b66;
            background-color: #fff7ec;
            box-shadow: 0 0 0 3px rgba(196, 155, 102, 0.1);
        }

        .form-group input.highlight {
            border: 4px solid #c49b66;
            background-color: #fff7ec;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #c49b66;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            background-color: #b38850;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(196, 155, 102, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .emoji-item {
            position: absolute;
            font-size: 3rem;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            pointer-events: none;
            user-select: none;
            will-change: transform;
            z-index: 10;
        }

        .emoji-item:nth-child(even) {
            filter: drop-shadow(0 4px 10px rgba(255, 105, 135, 0.5));
        }

        .emoji-item:nth-child(odd) {
            filter: drop-shadow(0 4px 10px rgba(255, 238, 0, 0.5));
        }
        
        .back-link {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        .back-link a {
            color: #6d5643;
            text-decoration: underline;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: #c9a66b;
        }
        
        .validation-msg {
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 18px;
        }
        
        .validation-msg.error {
            color: #e74c3c;
        }
        
        .validation-msg.success {
            color: #27ae60;
        }
        
        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .status-indicator.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Emoji background container -->
    <div id="emoji-field"></div>

    <!-- Main form container -->
    <div class="forgot-container">
        <div class="status-indicator" id="statusIndicator"></div>
        
        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your email or phone number and we'll send you a reset link.</p>

        <form id="forgotForm">
            <div class="form-group">
                <label for="username">Email or Phone Number</label>
                <input type="text" id="username" name="username" required placeholder="Enter your email or phone">
                <div class="validation-msg" id="validationMsg"></div>
            </div>

            <button type="submit" class="login-button">Send Reset Link</button>
        </form>
        
        <p class="back-link">
            <a href="login.html">← Back to Login</a>
        </p>
    </div>

    <script>
        // ========================================
        // VANILLA JAVASCRIPT EVENTS
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            const emojiField = document.getElementById('emoji-field');
            const forgotContainer = document.querySelector('.forgot-container');
            const usernameInput = document.getElementById('username');
            const form = document.getElementById('forgotForm');
            const validationMsg = document.getElementById('validationMsg');
            const statusIndicator = document.getElementById('statusIndicator');
            
            const bakeryEmojis = ['🍪', '🍩', '🍰', '🥐', '🍞', '🥖'];
            const numberOfEmojis = 15;
            const emojis = [];
            const followFactor = 0.05;
            
            let targetX = window.innerWidth / 2;
            let targetY = window.innerHeight / 2;

            // Create emojis
            for (let i = 0; i < numberOfEmojis; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'emoji-item';
                emoji.textContent = bakeryEmojis[Math.floor(Math.random() * bakeryEmojis.length)];
                
                const initialX = Math.random() * (window.innerWidth - 100) + 50;
                const initialY = Math.random() * (window.innerHeight - 100) + 50;
                
                emoji.style.left = `${initialX}px`;
                emoji.style.top = `${initialY}px`;
                
                emoji.currentX = initialX;
                emoji.currentY = initialY;
                emoji.depth = Math.random() * 2 + 0.5;
                emoji.scale = 1 / emoji.depth;

                emojiField.appendChild(emoji);
                emojis.push(emoji);
            }

            // EVENT 1: MOUSEMOVE - Emoji tracking
            document.addEventListener('mousemove', (event) => {
                targetX = event.clientX;
                targetY = event.clientY;
                
                console.log('🖱️ Mousemove (Vanilla JS): Emoji tracking');
            });
            
            // Animation loop for emojis
            function animate() {
                emojis.forEach(emoji => {
                    const rect = emoji.getBoundingClientRect();
                    const emojiCenterX = rect.left + rect.width / 2;
                    const emojiCenterY = rect.top + rect.height / 2;

                    const dx = targetX - emojiCenterX;
                    const dy = targetY - emojiCenterY;

                    emoji.currentX += dx * followFactor * emoji.depth * 0.5;
                    emoji.currentY += dy * followFactor * emoji.depth * 0.5;

                    emoji.style.transform = `
                        translate(${emoji.currentX - rect.left}px, ${emoji.currentY - rect.top}px) 
                        scale(${emoji.scale})
                        rotate(${Math.sin(emoji.currentX / 500) * 10}deg)
                    `;
                });

                requestAnimationFrame(animate);
            }
            
            animate();

            // Validation function
            function validateInput(value) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phoneRegex = /^[\d\s\-\+\(\)]{10,}$/;
                
                if (emailRegex.test(value)) {
                    return { valid: true, type: 'email' };
                } else if (phoneRegex.test(value)) {
                    return { valid: true, type: 'phone' };
                }
                return { valid: false, type: null };
            }

            // EVENT 2: CLICK - Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = usernameInput.value.trim();
                
                console.log('🖱️ Click event (Vanilla JS): Submit button clicked');
                
                if (!username) {
                    validationMsg.textContent = '❌ Please enter your email or phone number';
                    validationMsg.className = 'validation-msg error';
                    return;
                }
                
                const validation = validateInput(username);
                
                if (validation.valid) {
                    statusIndicator.textContent = '✅';
                    statusIndicator.classList.add('show');
                    
                    alert('✅ Reset link sent!\n\nWe\'ve sent a password reset link to:\n' + username + '\n\nPlease check your ' + (validation.type === 'email' ? 'email' : 'phone') + '.');
                    
                    this.reset();
                    validationMsg.textContent = '';
                    
                    setTimeout(() => {
                        statusIndicator.classList.remove('show');
                    }, 2000);
                } else {
                    validationMsg.textContent = '❌ Invalid email or phone format';
                    validationMsg.className = 'validation-msg error';
                }
            });

            // EVENT 3: KEYPRESS - Real-time validation
            usernameInput.addEventListener('keypress', function(e) {
                console.log('⌨️ Keypress event (Vanilla JS): ' + e.key);
                
                statusIndicator.textContent = '⌨️';
                statusIndicator.classList.add('show');
                
                clearTimeout(window.keypressTimer);
                window.keypressTimer = setTimeout(() => {
                    statusIndicator.classList.remove('show');
                }, 1000);
            });

            // EVENT 4: FOCUS - Input highlighting
            usernameInput.addEventListener('focus', function() {
                console.log('🎯 Focus event (Vanilla JS): Username input focused');
                this.classList.add('highlight');
                validationMsg.textContent = '✍️ Enter your email or phone number';
                validationMsg.className = 'validation-msg';
            });

            usernameInput.addEventListener('blur', function() {
                this.classList.remove('highlight');
                
                if (this.value.trim() === '') {
                    validationMsg.textContent = '';
                }
            });

            // EVENT 5: CHANGE - Input validation
            usernameInput.addEventListener('change', function() {
                const value = this.value.trim();
                
                console.log('🔄 Change event (Vanilla JS): Value = ' + value);
                
                if (value === '') {
                    validationMsg.textContent = '';
                    validationMsg.className = 'validation-msg';
                    return;
                }
                
                const validation = validateInput(value);
                
                if (validation.valid) {
                    if (validation.type === 'email') {
                        validationMsg.textContent = '✅ Valid email address';
                        validationMsg.className = 'validation-msg success';
                    } else {
                        validationMsg.textContent = '✅ Valid phone number';
                        validationMsg.className = 'validation-msg success';
                    }
                } else {
                    validationMsg.textContent = '⚠️ Please enter a valid email or phone';
                    validationMsg.className = 'validation-msg error';
                }
            });

            // Window resize handler
            window.addEventListener('resize', () => {
                targetX = window.innerWidth / 2;
                targetY = window.innerHeight / 2;
            });
        });

        // ========================================
        // JQUERY EVENTS
        // ========================================
        $(document).ready(function() {
            console.log('✅ Forgot Password Page - jQuery Loaded!');
            
            // jQuery MOUSEMOVE - Container movement
            $(document).mousemove(function(e) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                $(".forgot-container").css({
                    "transform": "translate(" + moveX + "px, " + moveY + "px)"
                });
            });

            // jQuery CLICK - Link tracking
            $('.back-link a').on('click', function() {
                console.log('🖱️ Click event (jQuery): Back to login clicked');
            });

            // jQuery KEYPRESS - Character counter
            let typingCount = 0;
            $('#username').on('keypress', function() {
                typingCount++;
                console.log('⌨️ Keypress event (jQuery): Total keys pressed = ' + typingCount);
            });

            // jQuery FOCUS - Label animation
            $('#username').on('focus', function() {
                console.log('🎯 Focus event (jQuery): Input focused');
                
                $(this).parent().find('label').css({
                    'color': '#c9a66b',
                    'transform': 'scale(1.05)'
                });
            }).on('blur', function() {
                $(this).parent().find('label').css({
                    'color': '#6d5643',
                    'transform': 'scale(1)'
                });
            });

            // jQuery CHANGE - Alternative validation
            $('#username').on('input', function() {
                const value = $(this).val();
                if (value.length > 5) {
                    console.log('🔄 Change event (jQuery): Input length = ' + value.length);
                }
            });

            // Heading animation
            $('h2').on('click', function() {
                $(this).css({
                    'transform': 'scale(1.1) rotate(2deg)',
                    'text-shadow': '0 0 10px rgba(201, 166, 107, 0.5)'
                });
                setTimeout(() => {
                    $(this).css({
                        'transform': 'scale(1) rotate(0)',
                        'text-shadow': 'none'
                    });
                }, 300);
            });

            // Button hover effect
            $('.login-button').hover(
                function() {
                    $(this).css({
                        'box-shadow': '0 6px 20px rgba(196, 155, 102, 0.5)',
                        'transform': 'translateY(-3px) scale(1.02)'
                    });
                },
                function() {
                    if (!$(this).is(':active')) {
                        $(this).css({
                            'box-shadow': '0 4px 12px rgba(196, 155, 102, 0.3)',
                            'transform': 'translateY(0) scale(1)'
                        });
                    }
                }
            );

            // Form animation on load
            $('.forgot-container').css('opacity', '0').animate({
                opacity: 1
            }, 500);
        });
    </script>
</body>
</html>
