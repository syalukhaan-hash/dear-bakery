<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dear Bakery</title>
    <link rel="stylesheet" href="style.css">    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ecddc5 0%, #f8f0e5 100%);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 100 100'><text y='90' font-size='90'>🧁</text></svg>") 15 15, auto;
            perspective: 1000px;
            font-family: 'Georgia', serif;
            padding: 50px 20px;
        }
        
        /* Bakery Emoji Rain Background */
        #bakery-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bakery-emoji {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            will-change: transform, opacity;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: rain-fall-smooth linear infinite;
        }

        @keyframes rain-fall-smooth {
            0% {
                top: -10%;
                opacity: 0;
                transform: translateX(0) rotate(0deg) scale(0.5);
            }
            5% {
                opacity: 0.7;
                transform: translateX(calc(var(--drift) * 0.05)) rotate(18deg) scale(1);
            }
            95% {
                opacity: 0.7;
                transform: translateX(calc(var(--drift) * 0.95)) rotate(342deg) scale(1);
            }
            100% {
                top: 110%;
                opacity: 0;
                transform: translateX(var(--drift)) rotate(360deg) scale(0.5);
            }
        }

        .login-container {
            background: linear-gradient(145deg, #f8f0e5, #ffffff);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(92, 59, 47, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            z-index: 10;
            border: 3px solid #c9a66b;
        }

        .login-container::before {
            content: '🔒';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        h2 {
            margin-bottom: 30px;
            color: #6d5643;
            font-size: 2rem;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        h2:hover {
            transform: scale(1.05);
            color: #c9a66b;
            text-shadow: 0 0 15px rgba(201, 166, 107, 0.5);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #6d5643;
            font-size: 0.98rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d4c5b0;
            border-radius: 10px;
            font-size: 0.98rem;
            transition: all 0.3s ease;
            background-color: #fff;
            font-family: 'Georgia', serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c49b66;
            background-color: #fff7ec;
            box-shadow: 0 0 0 4px rgba(196, 155, 102, 0.2);
            transform: scale(1.01);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c49b66, #d4b884);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(196, 155, 102, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .login-button:hover {
            background: linear-gradient(135deg, #b38850, #c9a66b);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(196, 155, 102, 0.5);
        }

        .forgot-password {
            margin-top: 15px;
            font-size: 0.9em;
        }

        .forgot-password a {
            color: #6d5643; 
            text-decoration: underline; 
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: #c49b66;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="bakery-field"></div>

    <div class="login-container">
        <h2>Member Login</h2>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">👤 Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username or email">
            </div>
            <div class="form-group">
                <label for="password">🔒 Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="login-button">Login</button>
        </form>
        
        <p class="forgot-password">
            <a href="forgotpassword.html">Forgot Password?</a>
        </p>

        <p class="forgot-password" style="margin-top: 20px;">
            Don't have an account? 
            <a href="register.html" target="contentFrame">
                Create Account
            </a>
        </p>
    </div>

    <script>
        // ========================================
        // VANILLA JAVASCRIPT EVENTS (LOGIN)
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            const bakeryField = document.getElementById('bakery-field');
            const loginContainer = document.querySelector('.login-container');
            
            const bakeryEmojis = ['🍪', '🍩', '🍰', '🥐', '🍞', '🥖', '🧁', '🥯', '🥨', '🍮'];

            // Create continuously raining bakery emojis with smooth appearance
            function createRainingEmoji() {
                const emoji = document.createElement('div');
                emoji.className = 'bakery-emoji';
                emoji.textContent = bakeryEmojis[Math.floor(Math.random() * bakeryEmojis.length)];

                // Random horizontal position
                emoji.style.left = Math.random() * 100 + '%';
                
                // Random drift amount for horizontal movement
                const drift = (Math.random() - 0.5) * 100 + 'px';
                emoji.style.setProperty('--drift', drift);
                
                // Random animation duration (speed) - slower for smoother effect
                const duration = Math.random() * 4 + 6; // 6-10 seconds (slower)
                emoji.style.animationDuration = duration + 's';
                
                // No delay - smooth continuous flow
                emoji.style.animationDelay = '0s';
                
                // Random size
                emoji.style.fontSize = (Math.random() * 1.5 + 2) + 'rem';

                bakeryField.appendChild(emoji);

                // Remove emoji after animation completes
                setTimeout(() => {
                    emoji.remove();
                }, duration * 1000);
            }

            // Create initial batch with staggered timing for smooth start
            for (let i = 0; i < 20; i++) {
                setTimeout(() => createRainingEmoji(), i * 200);
            }

            // Continuously create new falling emojis - more frequent for seamless flow
            setInterval(() => {
                createRainingEmoji();
            }, 600);

            // EVENT: MOUSEMOVE - very subtle parallax effect
            let currentX = 0;
            let currentY = 0;
            let targetX = 0;
            let targetY = 0;

            document.addEventListener('mousemove', (event) => {
                targetX = (event.clientX - window.innerWidth / 2) * 0.003;
                targetY = (event.clientY - window.innerHeight / 2) * 0.003;
            });

            // Smooth animation loop using requestAnimationFrame
            function smoothParallax() {
                currentX += (targetX - currentX) * 0.1; // Smooth interpolation
                currentY += (targetY - currentY) * 0.1;
                
                loginContainer.style.transform =
                    `translate(${currentX}px, ${currentY}px) rotateY(${currentX * 0.05}deg) rotateX(${-currentY * 0.05}deg)`;
                
                requestAnimationFrame(smoothParallax);
            }
            smoothParallax();

            // EVENT: SUBMIT - form submission with alert
            const loginForm = document.querySelector('form');
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    alert('❌ Please fill in all fields!');
                    return;
                }

                // Success alert
                alert('✅ Login successful!\nWelcome back to Dear Bakery! 🧁🎉');
                
                // Optional: Reset form after successful login
                this.reset();
            });
        });

        // ========================================
        // JQUERY EVENTS (LOGIN)
        // ========================================
        $(document).ready(function () {
            console.log('✅ Login Page - jQuery Loaded!');

            // jQuery CLICK - heading & links
            $('h2').on('click', function () {
                $(this).css({
                    'transform': 'scale(1.15) rotate(3deg)',
                    'color': '#c9a66b'
                });
                setTimeout(() => {
                    $(this).css({
                        'transform': 'scale(1) rotate(0deg)',
                        'color': '#6d5643'
                    });
                }, 300);
            });

            $('.forgot-password a').on('click', function () {
                $(this).css('transform', 'scale(0.95)');
                setTimeout(() => {
                    $(this).css('transform', 'scale(1)');
                }, 120);
            });
            
            // Button hover enhancement
            $('.login-button').hover(
                function () {
                    $(this).css({
                        'box-shadow': '0 12px 40px rgba(196, 155, 102, 0.6)',
                        'letter-spacing': '2px'
                    });
                },
                function () {
                    $(this).css({
                        'box-shadow': '0 6px 20px rgba(196, 155, 102, 0.4)',
                        'letter-spacing': '1px'
                    });
                }
            );

            // Container entrance animation
            $('.login-container').css('opacity', '0').css('transform', 'scale(0.8)');
            setTimeout(() => {
                $('.login-container').animate({ opacity: 1 }, 500);
                $('.login-container').css('transform', 'scale(1)');
            }, 100);
        });
    </script>
</body>
</html>
