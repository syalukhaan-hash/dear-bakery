services:
  
  toko-roti-ku:
    build: .
    container_name: toko-roti-bakery
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: always